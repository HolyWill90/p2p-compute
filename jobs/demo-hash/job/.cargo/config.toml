[build]
target = "riscv64imac-unknown-none-elf"

[target.riscv64imac-unknown-none-elf]
# -a: no atomics → no lr/sc in the instruction stream (the emulator pins
# rv64imc). Compressed instructions are allowed: the emulator decodes them,
# and lld's relax/compress passes are deterministic build-time transforms of
# the binary, not runtime behavior. The linker script places the image at
# the ABI's ELF_BASE.
rustflags = [
    "-C", "link-arg=-Tlink.ld",
    "-C", "target-feature=-a",
]
