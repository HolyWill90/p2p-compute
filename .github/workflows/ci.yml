name: ci

# The deterministic-runtime contract, enforced continuously:
# every push, the emulator must produce byte-identical chunk hash
# chains on three operating systems and two CPU architectures.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: riscv64imac-unknown-none-elf

      - name: Build job ELFs (RISC-V)
        shell: bash
        run: |
          (cd jobs/demo-hash/job && cargo build --release)
          (cd jobs/agent-task/job && cargo build --release)
          cp jobs/demo-hash/job/target/riscv64imac-unknown-none-elf/release/demo-hash jobs/demo-hash/program.elf
          cp jobs/agent-task/job/target/riscv64imac-unknown-none-elf/release/agent-task jobs/agent-task/program.elf
          # Smoke job reuses the demo-hash program with a 32 KiB input so
          # the network tests execute seconds, not minutes, on CI.
          cp jobs/demo-hash/program.elf jobs/demo-hash-smoke/program.elf

      - name: Unit tests (ISA + quorum + network integration)
        run: cargo test --workspace

      - name: Official riscv-tests tally (tohost)
        run: cargo run -p conformance -- arch arch-tests

      - name: Differential determinism (debug vs release on this OS)
        run: |
          cargo run --release -p difftest -- jobs/demo-hash --out-prefix demo-hash
          cargo run --release -p difftest -- jobs/demo-hash-smoke --out-prefix demo-hash-smoke

      - name: Stage result hashes with per-OS filenames
        shell: bash
        run: |
          cp target/demo-hash-release.json "demo-hash-release-${{ matrix.os }}.json"
          cp target/demo-hash-smoke-release.json "demo-hash-smoke-release-${{ matrix.os }}.json"

      - name: Upload result hashes for cross-platform comparison
        uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.os }}
          path: "*-release-${{ matrix.os }}.json"

  conformance:
    # Independent-implementation differential: the same static RISC-V
    # ELF executed by our emulator and by qemu-riscv64 must produce
    # byte-identical output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: riscv64imac-unknown-none-elf

      - name: Build conformance job (RISC-V ELF)
        working-directory: jobs/conformance/job
        run: cargo build --release

      - name: Install job ELF into job directory
        run: cp jobs/conformance/job/target/riscv64imac-unknown-none-elf/release/conformance-isa jobs/conformance/program.elf

      - name: Run under our emulator
        run: cargo run --release -p conformance -- emu --elf jobs/conformance/program.elf --out target/conformance-emu.out

      - name: Run under QEMU and compare
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          qemu-riscv64 jobs/conformance/program.elf > target/conformance-qemu.out
          cargo run --release -p conformance -- compare target/conformance-emu.out target/conformance-qemu.out

      - name: Official riscv-tests tally (tohost, release)
        run: cargo run --release -p conformance -- arch arch-tests

  cross-verify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform hashes
        uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
          merge-multiple: true
          path: hashes

      - name: Assert chunk hash chains are identical across all platforms
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          # Compare each JOB's results across platforms (the job name is
          # the filename prefix before the -release-<os> suffix).
          jobs = {}
          for f in glob.glob('hashes/*.json'):
              stem = f.rsplit('-release-', 1)[0]
              jobs.setdefault(stem, []).append(f)
          for stem, files in sorted(jobs.items()):
              assert len(files) >= 3, f"{stem}: expected 3 platforms, got {files}"
              ref = json.load(open(sorted(files)[0]))
              for f in sorted(files)[1:]:
                  other = json.load(open(f))
                  assert ref['chunk_hashes'] == other['chunk_hashes'], f"{f}: chunk chain differs!"
                  assert ref['result_hash'] == other['result_hash'], f"{f}: result hash differs!"
                  assert ref['output_hex'] == other['output_hex'], f"{f}: output differs!"
              print(f"CROSS-PLATFORM PASS: {stem}: {len(files)} platforms, {len(ref['chunk_hashes'])} chunks, result {ref['result_hash']}")
          EOF
