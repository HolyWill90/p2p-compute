[package]
name = "sp1-host"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
# Keep in sync with the guest's sp1-zkvm version.
sp1-sdk = { version = "6.8.0", features = ["blocking"] }
serde_json = "1"
jobfmt = { path = "../crates/jobfmt" }
rvcore = { path = "../crates/rvcore" }

[build-dependencies]
sp1-build = "6.8.0"
